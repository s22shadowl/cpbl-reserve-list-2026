[tool.poetry]
name = "cpbl-reserve-scraper"
version = "0.1.0"
description = "從中職官網產生契約保留名簿資料"
authors = ["s22shadowl"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.34"
beautifulsoup4 = "^4.15"
lxml = "^6.1"
pillow = "^13.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2"
pytest-cov = "^7.1"

[tool.pytest.ini_options]
testpaths = ["scraper/tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
